<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">BreezeTTS — RunPod Serverless Worker</title>
  <desc id="hero-desc">A RunPod serverless worker for Breeze TTS 2: voice clone, voice design, and voice direction, with Backblaze B2 delivery or base64 fallback. Shown next to a terminal card running the local test harness and its JSON response.</desc>

  <rect width="1200" height="380" rx="24" fill="#0B0D0E"/>

  <!-- left: identity -->
  <g transform="translate(56 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- tiny waveform mark beside the eyebrow -->
    <g transform="translate(0 62)" fill="#FF6A3D">
      <rect x="0" y="-6" width="4" height="12" rx="2"/>
      <rect x="8" y="-10" width="4" height="20" rx="2"/>
      <rect x="16" y="-4" width="4" height="8" rx="2"/>
      <rect x="24" y="-13" width="4" height="26" rx="2"/>
    </g>
    <text x="40" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2" fill="#FF6A3D">RUNPOD SERVERLESS WORKER</text>

    <text x="0" y="155" font-size="64" font-weight="700" fill="#F5F3EF">BreezeTTS</text>

    <text x="0" y="192" font-size="21" fill="#C9CDD1">Zero-shot voice cloning, voice design, and</text>
    <text x="0" y="220" font-size="21" fill="#C9CDD1">voice direction — B2 delivery or base64.</text>

    <!-- metadata pills -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FF6A3D">
      <rect x="0" y="248" width="98" height="26" rx="13" fill="none" stroke="#5A3A2C"/>
      <text x="16" y="265">3 MODES</text>

      <rect x="110" y="248" width="132" height="26" rx="13" fill="none" stroke="#5A3A2C"/>
      <text x="126" y="265">8 VOCAL CUES</text>

      <rect x="254" y="248" width="196" height="26" rx="13" fill="none" stroke="#5A3A2C"/>
      <text x="270" y="265">24kHz · 16-BIT · MONO</text>
    </g>

    <text x="0" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#5E6469">schema_validator → engine → storage → handler</text>
  </g>

  <!-- right: terminal proof card -->
  <g transform="translate(700 40)">
    <rect width="448" height="300" rx="14" fill="#111417" stroke="#23262B" stroke-width="1.5"/>

    <circle cx="24" cy="24" r="5" fill="#3A3F45"/>
    <circle cx="44" cy="24" r="5" fill="#3A3F45"/>
    <circle cx="64" cy="24" r="5" fill="#3A3F45"/>
    <text x="424" y="29" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#5E6469">handler.py --test_input</text>

    <line x1="0" y1="44" x2="448" y2="44" stroke="#23262B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="24" y="76" fill="#FF6A3D">$ python3 handler.py \</text>
      <text x="24" y="102" fill="#B9BEC3">    --test_input '{"input": {...}}'</text>

      <text x="24" y="140" fill="#5E6469">→ engine.synthesize()   (warm — no cold load)</text>

      <text x="24" y="176" fill="#F5F3EF">{ "delivery": "s3",</text>
      <text x="24" y="200" fill="#F5F3EF">  "audio_url": "https://…tts.wav",</text>
      <text x="24" y="224" fill="#F5F3EF">  "size_bytes": 154032 }</text>
    </g>

    <!-- synthesized-audio waveform motif -->
    <g transform="translate(24 268)" fill="#FF6A3D" opacity="0.9">
      <rect x="0" y="-4" width="5" height="8" rx="2"/>
      <rect x="11" y="-9" width="5" height="18" rx="2"/>
      <rect x="22" y="-14" width="5" height="28" rx="2"/>
      <rect x="33" y="-6" width="5" height="12" rx="2"/>
      <rect x="44" y="-16" width="5" height="32" rx="2"/>
      <rect x="55" y="-10" width="5" height="20" rx="2"/>
      <rect x="66" y="-4" width="5" height="8" rx="2"/>
      <rect x="77" y="-12" width="5" height="24" rx="2"/>
      <rect x="88" y="-8" width="5" height="16" rx="2"/>
      <rect x="99" y="-16" width="5" height="32" rx="2"/>
      <rect x="110" y="-6" width="5" height="12" rx="2"/>
      <rect x="121" y="-11" width="5" height="22" rx="2"/>
      <rect x="132" y="-5" width="5" height="10" rx="2"/>
      <rect x="143" y="-14" width="5" height="28" rx="2"/>
      <rect x="154" y="-9" width="5" height="18" rx="2"/>
      <rect x="165" y="-4" width="5" height="8" rx="2"/>
      <rect x="176" y="-13" width="5" height="26" rx="2"/>
      <rect x="187" y="-8" width="5" height="16" rx="2"/>
      <rect x="198" y="-16" width="5" height="32" rx="2"/>
      <rect x="209" y="-6" width="5" height="12" rx="2"/>
      <rect x="220" y="-11" width="5" height="22" rx="2"/>
      <rect x="231" y="-5" width="5" height="10" rx="2"/>
      <rect x="242" y="-14" width="5" height="28" rx="2"/>
      <rect x="253" y="-9" width="5" height="18" rx="2"/>
      <rect x="264" y="-4" width="5" height="8" rx="2"/>
      <rect x="275" y="-12" width="5" height="24" rx="2"/>
      <rect x="286" y="-7" width="5" height="14" rx="2"/>
      <rect x="297" y="-15" width="5" height="30" rx="2"/>
      <rect x="308" y="-6" width="5" height="12" rx="2"/>
      <rect x="319" y="-10" width="5" height="20" rx="2"/>
      <rect x="330" y="-4" width="5" height="8" rx="2"/>
      <rect x="341" y="-13" width="5" height="26" rx="2"/>
      <rect x="352" y="-8" width="5" height="16" rx="2"/>
      <rect x="363" y="-5" width="5" height="10" rx="2"/>
      <rect x="374" y="-11" width="5" height="22" rx="2"/>
      <rect x="385" y="-6" width="5" height="12" rx="2"/>
      <rect x="396" y="-14" width="5" height="28" rx="2"/>
    </g>
  </g>
</svg>
